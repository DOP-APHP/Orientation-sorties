<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Outil d'aide à l'orientation des sorties d'hospitalisation : aiguillage vers les dispositifs et les pages Intranet AP-HP. Aucune donnée patient n'est saisie.">
    <title>Orientation des Sorties & Parcours RAD — Intranet AP-HP</title>
    <style>
        #intranet-widget button,
        #intranet-widget a {
            font-family: inherit;
        }

        #intranet-widget button:focus-visible,
        #intranet-widget a:focus-visible {
            outline: 3px solid var(--aphp-dark);
            outline-offset: 2px;
        }

        #intranet-widget abbr[title] {
            text-decoration: underline dotted;
            text-underline-offset: 2px;
            cursor: help;
        }

        #intranet-widget .question-heading:focus,
        #intranet-widget .bento-title:focus {
            outline: none;
        }

        #intranet-widget .content-version {
            display: none;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        #intranet-widget {
            --aphp-blue: #00509a;
            --aphp-dark: #003a70;
            --aphp-ice: #f0f7ff;
            --aphp-border: #d0e3f7;
            --surface-white: #ffffff;
            --bg-canvas: #f8fafc;
            --text-primary: #1d1d1f;
            --text-secondary: #515154;
            --text-muted: #6e6e73;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-pill: 999px;
            --shadow-soft: 0 6px 24px rgba(0, 80, 154, 0.06);
            --shadow-hover: 0 10px 30px rgba(0, 80, 154, 0.13);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            line-height: normal;
            text-align: left;
            background-color: var(--surface-white);
            width: 100%;
            margin: 20px auto;
            max-width: 920px;
            border-radius: var(--radius-lg);
            border: 1.5px solid var(--aphp-blue);
            box-shadow: var(--shadow-soft);
            padding: 24px 32px 28px 32px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
            transition: max-width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #intranet-widget *,
        #intranet-widget *::before,
        #intranet-widget *::after {
            box-sizing: border-box;
        }

        #intranet-widget.with-copilot {
            max-width: 1360px;
        }

        #intranet-widget .widget-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 14px;
            border-bottom: 1px solid #e5e5ea;
        }

        #intranet-widget .widget-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #intranet-widget .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--aphp-blue);
        }

        #intranet-widget .brand-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--aphp-blue);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        #intranet-widget .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        #intranet-widget .btn-reset-top {
            background-color: var(--surface-white);
            color: var(--aphp-blue);
            border: 1.5px solid var(--aphp-blue);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        #intranet-widget .btn-reset-top:hover {
            background-color: var(--aphp-ice);
        }

        #intranet-widget .breadcrumb-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 14px;
            margin-bottom: 4px;
        }

        #intranet-widget .crumb-pill {
            background-color: var(--surface-white);
            color: var(--aphp-blue);
            border: 1px solid var(--aphp-border);
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        #intranet-widget .crumb-pill:hover {
            background-color: var(--aphp-ice);
            border-color: var(--aphp-blue);
        }

        #intranet-widget .crumb-pill.current {
            background-color: var(--aphp-blue);
            color: var(--surface-white);
            border-color: var(--aphp-blue);
            cursor: default;
        }

        #intranet-widget .crumb-sep {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
        }

        #intranet-widget #stage-area {
            padding-top: 16px;
        }

        #intranet-widget .fade-view {
            animation: aphpFade 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes aphpFade {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #intranet-widget .question-stage {
            width: 100%;
            max-width: 780px;
            margin: 4px auto 8px auto;
            background-color: var(--surface-white);
            border: 1.5px solid var(--aphp-border);
            border-top: 5px solid var(--aphp-blue);
            border-radius: var(--radius-lg);
            padding: 30px 32px;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0, 80, 154, 0.04);
        }

        #intranet-widget .step-kicker {
            display: inline-block;
            background-color: var(--aphp-ice);
            color: var(--aphp-blue);
            border: 1px solid var(--aphp-border);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 0.74rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
        }

        #intranet-widget .question-heading {
            font-size: 1.42rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.35;
            margin: 0 0 24px 0;
            letter-spacing: -0.3px;
        }

        #intranet-widget .choices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
            gap: 14px;
        }

        #intranet-widget .choice-card {
            background-color: var(--surface-white);
            border: 1.5px solid var(--aphp-blue);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            transition: all 0.18s ease;
        }

        #intranet-widget .choice-card-label {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--aphp-blue);
            line-height: 1.4;
        }

        #intranet-widget .choice-card-arrow {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--aphp-blue);
            transition: transform 0.18s ease;
            flex-shrink: 0;
        }

        #intranet-widget .choice-card:hover {
            background-color: var(--aphp-blue);
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        #intranet-widget .choice-card:hover .choice-card-label,
        #intranet-widget .choice-card:hover .choice-card-arrow {
            color: var(--surface-white);
        }

        #intranet-widget .choice-card:hover .choice-card-arrow {
            transform: translateX(4px);
        }

        #intranet-widget .assistant-section {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px dashed var(--aphp-border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #intranet-widget .btn-assistant-trigger {
            background-color: var(--surface-white);
            color: var(--aphp-blue);
            border: 1.5px solid var(--aphp-blue);
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        #intranet-widget .btn-assistant-trigger:hover {
            background-color: var(--aphp-ice);
        }

        #intranet-widget .quiz-card {
            width: 100%;
            background-color: var(--surface-white);
            border: 2px solid var(--aphp-blue);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            margin-top: 14px;
            text-align: left;
        }

        #intranet-widget .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 14px;
            border-bottom: 1px solid #e5e5ea;
        }

        #intranet-widget .quiz-title {
            font-size: 0.84rem;
            font-weight: 800;
            color: var(--aphp-blue);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        #intranet-widget .quiz-close-btn {
            background: var(--surface-white);
            border: 1px solid var(--aphp-blue);
            color: var(--aphp-blue);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
        }

        #intranet-widget .quiz-q-text {
            font-size: 0.96rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.45;
        }

        #intranet-widget .quiz-opt-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #intranet-widget .quiz-opt-item {
            background-color: var(--surface-white);
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            padding: 11px 15px;
            text-align: left;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--aphp-blue);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        #intranet-widget .quiz-opt-item:hover {
            background-color: var(--aphp-ice);
            border-color: var(--aphp-blue);
        }

        #intranet-widget .quiz-verdict-box {
            background-color: var(--aphp-ice);
            border-left: 4px solid var(--aphp-blue);
            padding: 13px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--aphp-dark);
            margin-bottom: 14px;
        }

        #intranet-widget .quiz-actions-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        #intranet-widget .btn-quiz-go {
            background-color: var(--aphp-blue);
            color: var(--surface-white);
            border: none;
            padding: 9px 18px;
            border-radius: var(--radius-pill);
            font-size: 0.86rem;
            font-weight: 700;
            cursor: pointer;
        }

        #intranet-widget .btn-quiz-go:hover {
            background-color: var(--aphp-dark);
        }

        #intranet-widget .btn-quiz-retry {
            background-color: var(--surface-white);
            color: var(--aphp-blue);
            border: 1px solid var(--aphp-blue);
            padding: 9px 15px;
            border-radius: var(--radius-pill);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        #intranet-widget .workspace-split {
            display: flex;
            gap: 22px;
            align-items: flex-start;
            width: 100%;
        }

        #intranet-widget .workspace-main {
            flex: 1 1 54%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #intranet-widget .workspace-copilot {
            flex: 0 0 44%;
            max-width: 470px;
            background-color: var(--surface-white);
            border: 2px solid var(--aphp-blue);
            border-top: 6px solid var(--aphp-blue);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            box-shadow: var(--shadow-soft);
        }

        @media (max-width: 1040px) {
            #intranet-widget .workspace-split {
                flex-direction: column;
                align-items: stretch;
            }
            #intranet-widget .workspace-main {
                flex: 0 0 auto;
            }
            #intranet-widget .workspace-copilot {
                flex: 1 1 100%;
                max-width: 100%;
                width: 100%;
            }
        }

        #intranet-widget .bento-hero {
            background-color: var(--surface-white);
            border: 2px solid var(--aphp-blue);
            border-radius: var(--radius-md);
            padding: 22px 24px;
        }

        #intranet-widget .bento-hero-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        #intranet-widget .bento-title {
            font-size: 1.32rem;
            font-weight: 800;
            color: var(--aphp-blue);
            margin: 0;
            line-height: 1.28;
        }

        #intranet-widget .delay-badge {
            font-size: 0.76rem;
            font-weight: 700;
            padding: 5px 13px;
            border-radius: var(--radius-pill);
            white-space: nowrap;
        }

        #intranet-widget .delay-badge.urgent { background: #fff5f5; color: #9b2c2c; border: 1px solid #feb2b2; }
        #intranet-widget .delay-badge.warn { background: #fffaf0; color: #9c4221; border: 1px solid #fbd38d; }
        #intranet-widget .delay-badge.info { background: var(--aphp-ice); color: var(--aphp-blue); border: 1px solid var(--aphp-border); }

        #intranet-widget .bento-summary {
            font-size: 0.94rem;
            line-height: 1.55;
            color: var(--text-secondary);
            margin: 0 0 14px 0;
        }

        #intranet-widget .delay-callout {
            background-color: var(--aphp-ice);
            border-left: 4px solid var(--aphp-blue);
            padding: 11px 14px;
            border-radius: 6px;
            font-size: 0.86rem;
            line-height: 1.48;
            color: var(--aphp-dark);
        }

        #intranet-widget .pedagogie-callout {
            margin-top: 10px;
            padding: 11px 14px;
            background-color: var(--surface-white);
            border: 1px solid var(--aphp-border);
            border-radius: 6px;
            font-size: 0.84rem;
            line-height: 1.45;
            color: var(--text-secondary);
        }

        #intranet-widget .pedagogie-callout h4 {
            margin: 0 0 4px 0;
            color: var(--aphp-blue);
            font-size: 0.82rem;
            text-transform: uppercase;
        }

        #intranet-widget .pedagogie-callout p {
            margin: 0;
        }

        #intranet-widget .key-points,
        #intranet-widget .role-step-bullets {
            margin: 4px 0 0 0;
            padding-left: 18px;
            list-style: none;
        }

        #intranet-widget .key-points li,
        #intranet-widget .role-step-bullets li {
            position: relative;
            margin: 2px 0;
            line-height: 1.4;
        }

        #intranet-widget .key-points li::before,
        #intranet-widget .role-step-bullets li::before {
            content: "–";
            position: absolute;
            left: -14px;
            color: var(--aphp-blue);
            font-weight: 700;
        }

        #intranet-widget .key-points li {
            color: var(--text-primary);
        }

        #intranet-widget .hero-demarche-cta-row {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed var(--aphp-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        #intranet-widget .hero-demarche-cta-hint {
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--aphp-blue);
        }

        #intranet-widget .btn-hero-demarche {
            background-color: var(--aphp-blue);
            color: var(--surface-white);
            border: 2px solid var(--aphp-blue);
            padding: 10px 20px;
            border-radius: var(--radius-pill);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 80, 154, 0.2);
        }

        #intranet-widget .btn-hero-demarche:hover {
            background-color: var(--aphp-dark);
            border-color: var(--aphp-dark);
            transform: translateY(-1px);
        }

        #intranet-widget .btn-hero-demarche.active {
            background-color: var(--surface-white);
            color: var(--aphp-blue);
            box-shadow: none;
        }

        #intranet-widget .cerfa-compact-bar {
            background-color: var(--surface-white);
            border: 1.5px solid var(--aphp-border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        #intranet-widget .cerfa-compact-label {
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--aphp-blue);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        #intranet-widget .cerfa-pills-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        #intranet-widget .cerfa-compact-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background-color: var(--surface-white);
            border: 1.5px solid var(--aphp-blue);
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--aphp-blue);
            text-decoration: none;
            transition: all 0.15s ease;
        }

        #intranet-widget .cerfa-compact-pill:hover {
            background-color: var(--aphp-blue);
            color: var(--surface-white);
            transform: translateY(-1px);
        }

        #intranet-widget .cerfa-compact-code {
            background-color: var(--aphp-ice);
            color: var(--aphp-blue);
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: var(--radius-pill);
            text-transform: uppercase;
        }

        #intranet-widget .cerfa-compact-pill:hover .cerfa-compact-code {
            background-color: rgba(255, 255, 255, 0.22);
            color: var(--surface-white);
        }

        #intranet-widget .intranet-gateway-bar {
            background-color: var(--aphp-ice);
            border: 1.5px solid var(--aphp-blue);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        #intranet-widget .gateway-info {
            flex: 1;
            min-width: 220px;
        }

        #intranet-widget .gateway-label {
            font-size: 0.73rem;
            font-weight: 800;
            color: var(--aphp-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        #intranet-widget .gateway-desc {
            font-size: 0.86rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        #intranet-widget .btn-gateway-primary {
            background-color: var(--aphp-blue);
            color: var(--surface-white);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: var(--radius-pill);
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s ease;
            box-shadow: 0 3px 10px rgba(0, 80, 154, 0.18);
            white-space: nowrap;
        }

        #intranet-widget .btn-gateway-primary:hover {
            background-color: var(--aphp-dark);
            transform: translateY(-1px);
        }

        #intranet-widget .copilot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--aphp-ice);
            gap: 8px;
        }

        #intranet-widget .copilot-title {
            font-size: 0.86rem;
            font-weight: 800;
            color: var(--aphp-blue);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        #intranet-widget .copilot-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #intranet-widget .btn-copilot-small {
            background-color: var(--surface-white);
            border: 1px solid var(--aphp-blue);
            color: var(--aphp-blue);
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 0.73rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        #intranet-widget .btn-copilot-small:hover {
            background-color: var(--aphp-ice);
        }

        #intranet-widget .copilot-sec-label {
            font-size: 0.74rem;
            font-weight: 800;
            color: var(--aphp-blue);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin: 10px 0 8px 0;
        }

        #intranet-widget .role-accordion-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #intranet-widget .role-accordion-card {
            border: 1.5px solid var(--aphp-border);
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--surface-white);
        }

        #intranet-widget .role-accordion-header {
            width: 100%;
            background-color: var(--surface-white);
            border: none;
            border-left: 4px solid var(--aphp-blue);
            padding: 10px 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.15s ease;
        }

        #intranet-widget .role-accordion-header:hover {
            background-color: var(--aphp-ice);
        }

        #intranet-widget .role-accordion-header.open {
            background-color: var(--aphp-ice);
            border-bottom: 1px solid var(--aphp-border);
        }

        #intranet-widget .role-header-title {
            font-size: 0.82rem;
            font-weight: 800;

            <p class="link-fallback-text">L'intranet a bloqué l'ouverture de ce lien depuis l'outil. Copiez l'adresse ci-dessous et collez-la dans un nouvel onglet :</p>
            <input type="text" id="link-fallback-input" class="copy-fallback" readonly aria-label="Adresse du lien à ouvrir">
        </div>

    <script>
        (function() {
            /*
             * CONFIGURATION DE L'OUTIL — seul bloc à modifier lors d'un déploiement sur un nouveau site
             * 1. sitesAPHP : une entrée par hôpital. Dans "pages", remplacer chaque url provisoire (#intranet-…)
             *    par l'adresse de la page Intranet du site. Dans "ancres", associer à une branche (ex. "res_ehpad")
             *    le lien d'ancre copié sur le titre de section de la page ; sans ancre, le bouton ouvre la page en haut.
             * 2. Le site est lu dans l'attribut data-site du bloc #intranet-widget, ou dans l'adresse (?site=beaujon).
             * 3. contactMiseAJour : adresse de la DOP qui reçoit les signalements de mise à jour (vide = lien masqué).
             * 4. mesureAudience : événements anonymes de consultation (aucune donnée patient) vers l'outil de mesure.
             * 5. urlOutil : adresse de la page Intranet qui affiche l'outil, utilisée pour les liens partagés
             *    (vide = adresse de la page détectée automatiquement).
             * 7. Intégration SharePoint : publier ce fichier sous le nom index.html sur le site web de l'équipe, puis coller
             *    dans le composant « Incorporer » : <iframe src="[adresse du site]?site=bichat" width="1200" height="1000"
             *    title="Orientation des sorties"></iframe>. Ajouter #orientation=res_ehpad à la fin de l'adresse ouvre
             *    directement une fiche. Tant qu'une page Intranet garde son adresse provisoire (#intranet-…), le bouton
             *    de la passerelle est remplacé par la mention « page en cours de création ».
             * 6. routageIntranetAPHP : "section" reprend exactement le titre de section de la page Intranet.
             */
            var configurationOutil = {
                siteParDefaut: "bichat",
                contactMiseAJour: "",
                mesureAudience: true,
                urlOutil: ""
            };

            var sitesAPHP = {
                "bichat": {
                    pages: { contacts: "#intranet-contacts-internes", smr: "#intranet-smr", domicile: "#intranet-retour-domicile", grand_age: "#intranet-grand-age", handicap: "#intranet-handicap", precarite: "#intranet-precarite" },
                    ancres: {}
                },
                "beaujon": {
                    pages: { contacts: "#intranet-contacts-internes", smr: "#intranet-smr", domicile: "#intranet-retour-domicile", grand_age: "#intranet-grand-age", handicap: "#intranet-handicap", precarite: "#intranet-precarite" },
                    ancres: {}
                }
            };

            var pagesIntranetAPHP = {
                "contacts": { titre: "Mes contacts internes" },
                "smr": { titre: "SMR / SSR" },
                "domicile": { titre: "Retour à domicile : soins et coordination" },
                "grand_age": { titre: "Grand âge" },
                "handicap": { titre: "Handicap" },
                "precarite": { titre: "Précarité / sans domicile" }
            };

            var routageIntranetAPHP = {
                "res_hotel_hosp": { page: "contacts", section: "Hôtel hospitalier" },
                "res_ssr": { page: "smr", section: "Soins médicaux et de réadaptation (SMR)" },
                "res_rad_standard": { page: "domicile", section: "Retour à domicile simple" },
                "res_ssiad": { page: "domicile", section: "Soins infirmiers à domicile" },
                "res_had": { page: "domicile", section: "Hospitalisation à domicile (HAD)" },
                "res_hdj": { page: "domicile", section: "Hôpital de jour (HDJ)" },

                if (bloc === "nearest" && rect.top >= 0) cible = window.pageYOffset + rect.bottom - window.innerHeight + 8;

                });

                bodies.forEach(function(b, idx) {
                    var hdr = document.getElementById("role-hdr-" + idx);
                    var chev = document.getElementById("role-chev-" + idx);
                    if (allOpen) {
                        b.classList.add("hidden");
                        if (hdr) { hdr.classList.remove("open"); hdr.setAttribute("aria-expanded", "false"); }
                        if (chev) chev.textContent = "Ouvrir ▼";
                    } else {
                        b.classList.remove("hidden");
                        if (hdr) { hdr.classList.add("open"); hdr.setAttribute("aria-expanded", "true"); }
                        if (chev) chev.textContent = "Masquer ▲";
                    }
                });

                var btnAll = document.getElementById("btn-expand-all-roles");
                if (btnAll) {
                    btnAll.textContent = allOpen ? "Tout déplier" : "Tout replier";
                }
            }

            function listeTirets(points, sigles, classe) {
                return '<ul class="' + classe + '">' + points.map(function(pt) {
                    return '<li>' + annoterSigles(pt, sigles) + '</li>';
                }).join("") + '</ul>';
            }

            function genererVoletDemarcheHtml(donnee) {
                var demarcheObj = donnee.checklistKey ? demarchesMetiers[donnee.checklistKey] : null;
                var rolesHtml = "";

                if (demarcheObj) {
                    var roles = Object.keys(demarcheObj);
                    rolesHtml = '<div class="copilot-sec-label">Déroulement opérationnel par métier :</div>' +
                        '<div class="role-accordion-list">';

                    roles.forEach(function(role, idx) {
                        var items = demarcheObj[role];
                        var siglesVus = {};
                        var nbEtapes = items.filter(function(it) { return !it.vigilance; }).length;
                        rolesHtml += '<div class="role-accordion-card">' +
                            '<button type="button" id="role-hdr-' + idx + '" class="role-accordion-header" data-action="toggle-role" data-role-idx="' + idx + '" aria-expanded="false" aria-controls="role-body-' + idx + '">' +
                                '<span class="role-header-title">' + role + '</span>' +
                                '<div class="role-header-right">' +
                                    '<span class="role-count-pill">' + nbEtapes + ' étape(s)</span>' +
                                    '<span id="role-chev-' + idx + '" class="role-chevron">Ouvrir ▼</span>' +
                                '</div>' +
                            '</button>' +
                            '<div id="role-body-' + idx + '" class="role-accordion-body hidden">';

                        var numStep = 0;
                        items.forEach(function(itemObj) {
                            if (itemObj.vigilance) {
                                rolesHtml += '<div class="role-vigilance-box">' +
                                    '<span class="role-vigilance-label">Point critique & Relais</span>' +
                                    '<span>' + annoterSigles(itemObj.vigilance, siglesVus) + '</span>' +
                                '</div>';
                            } else {
                                numStep++;
                                rolesHtml += '<div class="role-step-row">' +
                                    '<span class="role-step-num">' + numStep + '</span>' +
                                    '<div class="role-step-text">' +
                                        (itemObj.titre ? '<span class="role-step-title">' + itemObj.titre + '</span>' : '') +
                                        (Array.isArray(itemObj.texte)
                                            ? listeTirets(itemObj.texte, siglesVus, "role-step-bullets")
                                            : '<span>' + annoterSigles(itemObj.texte, siglesVus) + '</span>') +
                                    '</div>' +
                                '</div>';
                            }
                        });

                        rolesHtml += '</div></div>';
                    });
                    rolesHtml += '</div>';
                }

                var cerfaNoticeHtml = "";
                if (donnee.formulairesKey && catalogueFormulaires[donnee.formulairesKey]) {
                    var listeCerfa = catalogueFormulaires[donnee.formulairesKey];
                    cerfaNoticeHtml = '<div class="copilot-cerfa-box">' +
                        '<div class="copilot-sec-label">Répartition & notice des formulaires CERFA (Cliquables) :</div>';

                    listeCerfa.forEach(function(f) {
                        cerfaNoticeHtml += '<a href="' + f.url + '" target="_blank" rel="noopener noreferrer" data-ouverture="onglet" class="copilot-cerfa-link-card" title="Ouvrir le formulaire officiel">' +
                            '<div class="copilot-cerfa-top">' +
                                '<span class="copilot-cerfa-name">' + f.code + ' — ' + f.titre + ' ↗</span>' +
                                '<span class="copilot-cerfa-role">' + f.acteur + '</span>' +
                            '</div>' +
                            '<div class="copilot-cerfa-desc">' + f.desc + '</div>' +
                        '</a>';
                    });
                    cerfaNoticeHtml += '</div>';
                }

                return '<aside id="copilot-panel" class="workspace-copilot hidden">' +
                    '<div class="copilot-header">' +
                        '<span class="copilot-title">Déroulement de la démarche</span>' +
                        '<div class="copilot-header-actions">' +
                            '<button type="button" id="btn-expand-all-roles" class="btn-copilot-small" data-action="expand-all-roles">Tout déplier</button>' +
                            '<button type="button" class="btn-copilot-small" data-action="toggle-copilot">Fermer</button>' +
                        '</div>' +
                    '</div>' +
                    rolesHtml +
                    cerfaNoticeHtml +
                '</aside>';
            }

            function basculerAssistantQuiz(quizId) {
                var box = document.getElementById("quiz-box-container");
                if (!box) return;
                var declencheur = widgetContainer.querySelector(".btn-assistant-trigger");
                if (box.classList.contains("hidden")) {
                    afficherElem("quiz-box-container", true, "block");
                    afficherQuestionAssistant(quizId, "q1");
                    if (declencheur) declencheur.setAttribute("aria-expanded", "true");
                    tracer("assistant_ouvert", quizId);
                } else {
                    afficherElem("quiz-box-container", false);
                    if (declencheur) declencheur.setAttribute("aria-expanded", "false");
                }
            }

            function afficherQuestionAssistant(quizId, keyEtape) {
                var quiz = miniQuizzes[quizId];
                var etape = quiz.etapes[keyEtape];
                var body = document.getElementById("quiz-box-body");
                if (!body) return;

                var html = '<div class="quiz-q-text">' + etape.question + '</div><div class="quiz-opt-list">';
                etape.options.forEach(function(opt, idx) {
                    if (opt.suivant) {
                        html += '<button type="button" class="quiz-opt-item" data-action="quiz-step" data-quiz="' + quizId + '" data-next="' + opt.suivant + '">' + opt.texte + '</button>';
                    } else {
                        html += '<button type="button" class="quiz-opt-item" data-action="quiz-verdict" data-quiz="' + quizId + '" data-step="' + keyEtape + '" data-opt="' + idx + '">' + opt.texte + '</button>';
                    }
                });
                html += '</div>';
                body.innerHTML = html;
            }

            function afficherVerdictAssistant(quizId, keyEtape, optIdx) {
                var opt = miniQuizzes[quizId].etapes[keyEtape].options[optIdx];
                var body = document.getElementById("quiz-box-body");
                if (!body) return;

                var safeAriane = echapperAttr(opt.labelBouton.replace("Voir la démarche ", "").replace(" →", ""));
                tracer("assistant_verdict", quizId + " > " + opt.cible);
                var html = '<div class="quiz-verdict-box">' + opt.resultat + '</div>' +
                    '<div class="quiz-actions-row">' +
                        '<button type="button" class="btn-quiz-go" data-action="choice" data-dest="' + opt.cible + '" data-ariane="' + safeAriane + '">' + opt.labelBouton + '</button>' +
                        '<button type="button" class="btn-quiz-retry" data-action="quiz-step" data-quiz="' + quizId + '" data-next="q1">Revoir les questions</button>' +
                    '</div>';
                body.innerHTML = html;
            }

            function rendreEtape(idEtape) {
                var donnee = logigramme[idEtape];
                if (!donnee) return;

                voletDemarcheOuvert = false;
                widgetContainer.classList.remove("with-copilot");

                rendreFilAriane(donnee);

                stageArea.innerHTML = "";
                afficherElem("copy-fallback", false);
                tracer(donnee.type === "resultat" ? "fiche" : "etape", idEtape);
                stageArea.classList.remove("anim-initial", "anim-forward", "anim-back");
                void stageArea.offsetWidth;
                stageArea.classList.add("anim-" + sensNavigation);

                if (donnee.type === "question") {
                    afficherElem("btn-print-memo", false);
                    afficherElem("btn-copy-link", false);

                    var numQuestion = traceNavigation.length + 1;
                    var htmlQ = '<div class="question-stage">' +
                        '<div class="step-kicker">Question ' + numQuestion + '</div>' +
                        '<h2 class="question-heading" tabindex="-1">' + donnee.texte + '</h2>' +
                        '<div class="choices-grid">';

                    donnee.choix.forEach(function(c) {
                        var labelAriane = echapperAttr(c.ariane || c.label);
                        htmlQ += '<button type="button" class="choice-card" data-action="choice" data-dest="' + c.destination + '" data-ariane="' + labelAriane + '">' +
                            '<span class="choice-card-label">' + c.label + '</span>' +
                            '<span class="choice-card-arrow">→</span>' +
                        '</button>';
                    });
                    htmlQ += '</div>';

                    if (donnee.quizId && miniQuizzes[donnee.quizId]) {
                        var qObj = miniQuizzes[donnee.quizId];
                        htmlQ += '<div class="assistant-section">' +
                            '<button type="button" class="btn-assistant-trigger" data-action="toggle-quiz" data-quiz="' + donnee.quizId + '" aria-expanded="false" aria-controls="quiz-box-container">' +
                                'Hésitation sur le dispositif ? Utiliser l\'assistant d\'arbitrage en 2 clics' +
                            '</button>' +
                            '<div id="quiz-box-container" class="quiz-card hidden">' +
                                '<div class="quiz-header">' +
                                    '<span class="quiz-title">' + qObj.titre + '</span>' +
                                    '<button type="button" class="quiz-close-btn" data-action="toggle-quiz" data-quiz="' + donnee.quizId + '">Fermer</button>' +
                                '</div>' +
                                '<div id="quiz-box-body"></div>' +
                            '</div>' +
                        '</div>';
                    }

                    htmlQ += '</div>';
                    stageArea.innerHTML = htmlQ;

                } else if (donnee.type === "resultat") {
                    afficherElem("btn-print-memo", true, "inline-block");
                    afficherElem("btn-copy-link", true, "inline-block");

                    var delayLevel = (donnee.alerteDelai && donnee.alerteDelai.niveau) ? donnee.alerteDelai.niveau : "info";
                    var delayBadgeHtml = donnee.alerteDelai
                        ? ('<span class="delay-badge ' + delayLevel + '">' + donnee.alerteDelai.badge + '</span>')
                        : '';
                    var siglesHero = {};
                    var resumeHtml = annoterSigles(donnee.details, siglesHero);
                    var delayCalloutHtml = (donnee.alerteDelai && donnee.alerteDelai.texte)
                        ? ('<div class="delay-callout"><b>Délai & anticipation :</b> ' + annoterSigles(donnee.alerteDelai.texte, siglesHero) + '</div>')
                        : '';
                    var pedagogieHtml = "";
                    if (donnee.pedagogie && donnee.pedagogie.points) {
                        pedagogieHtml = '<div class="pedagogie-callout"><h4>' + donnee.pedagogie.titre + '</h4>' +
                            listeTirets(donnee.pedagogie.points, siglesHero, "key-points") + '</div>';
                    } else if (donnee.pedagogie) {
                        pedagogieHtml = '<div class="pedagogie-callout">' + donnee.pedagogie + '</div>';
                    }

                    var heroHtml = '<div class="bento-hero">' +
                        '<div class="bento-hero-top">' +
                            '<h2 class="bento-title" tabindex="-1">' + donnee.titre + '</h2>' +
                            delayBadgeHtml +
                        '</div>' +
                        '<p class="bento-summary">' + resumeHtml + '</p>' +
                        delayCalloutHtml +
                        pedagogieHtml +
                        '<div class="hero-demarche-cta-row">' +
                            '<span class="hero-demarche-cta-hint">Consultez le détail des étapes pour chaque professionnel (Médecin, Service Social, IDE) :</span>' +
                            '<button type="button" id="btn-hero-demarche" class="btn-hero-demarche" data-action="toggle-copilot" aria-expanded="false" aria-controls="copilot-panel">' +
                                '▸ Afficher le déroulement de la démarche par métier' +
                            '</button>' +
                        '</div>' +
                    '</div>';

                    var cerfaBarHtml = "";
                    if (donnee.formulairesKey && catalogueFormulaires[donnee.formulairesKey]) {
                        var listeCerfa = catalogueFormulaires[donnee.formulairesKey];
                        cerfaBarHtml = '<div class="cerfa-compact-bar">' +
                            '<span class="cerfa-compact-label">Formulaires CERFA & Références :</span>' +
                            '<div class="cerfa-pills-group">';

                        listeCerfa.forEach(function(f) {
                            cerfaBarHtml += '<a href="' + f.url + '" target="_blank" rel="noopener noreferrer" data-ouverture="onglet" class="cerfa-compact-pill">' +
                                '<span class="cerfa-compact-code">' + f.code + '</span>' +
                                '<span>' + f.titre + ' ↗</span>' +
                            '</a>';
                        });
                        cerfaBarHtml += '</div></div>';
                    }

                    var route = routageIntranetAPHP[idEtape] || { page: "", section: "" };
                    var pageInfo = pagesIntranetAPHP[route.page] || { titre: "Orientations et outils de sortie" };
                    var site = sitesAPHP[siteActif()];
                    var urlPasserelle = site.ancres[idEtape] || site.pages[route.page] || "#intranet";
                    var descPasserelle = route.section
                        ? 'Contacts et procédures de votre site : page « ' + pageInfo.titre + ' », section « ' + route.section + ' ».'
                        : 'Contacts et procédures de votre site : page « ' + pageInfo.titre + ' ».';
                    var gatewayHtml = '<div class="intranet-gateway-bar">' +
                        '<div class="gateway-info">' +
                            '<div class="gateway-label">Passerelle Intranet</div>' +
                            '<p class="gateway-desc">' + echapperAttr(descPasserelle) + '</p>' +
                        '</div>' +
                        (urlPasserelle.charAt(0) === "#"
                            ? '<span class="gateway-pending">Page Intranet « ' + pageInfo.titre + ' » en cours de création</span>'
                            : '<a href="' + echapperAttr(urlPasserelle) + '" target="_top" data-ouverture="page" class="btn-gateway-primary" data-action="gateway" data-dest="' + idEtape + '">Accéder à la page Intranet « ' + pageInfo.titre + ' » →</a>') +
                    '</div>';

                    stageArea.innerHTML = '<div class="workspace-split">' +
                        '<div class="workspace-main">' +
                            heroHtml +
                            cerfaBarHtml +
                            gatewayHtml +
                            genererSignalementHtml(donnee, idEtape) +
                        '</div>' +
                        genererVoletDemarcheHtml(donnee) +
                    '</div>';
                }

                afficherElem("link-fallback", false);
                if (!premierRendu) {
                    var titre = stageArea.querySelector("h2");
                    if (titre) {
                        try { titre.focus({ preventScroll: true }); } catch (e) { titre.focus(); }
                    }
                    var haut = widgetContainer.getBoundingClientRect().top;
                    if (haut < 0) defilerVers(widgetContainer, "start");
                }
                premierRendu = false;
            }

            widgetContainer.addEventListener("click", function(e) {
                var lienExterne = e.target.closest("a[data-ouverture]");
                if (lienExterne) {
                    var actionLien = lienExterne.getAttribute("data-action");
                    if (actionLien === "gateway") tracer("passerelle", lienExterne.getAttribute("data-dest"));
                    else if (actionLien === "signal") tracer("signalement", etapeCouranteId);
                    else tracer("cerfa", etapeCouranteId);
                    if (modeIntegre) {
                        e.preventDefault();
                        ouvrirLienIntegre(lienExterne);
                    }
                    return;
                }
                var btn = e.target.closest("[data-action]");
                if (!btn) return;
                var action = btn.getAttribute("data-action");

                if (action === "reset") {
                    reinitialiserParcours();
                } else if (action === "back") {
                    retourEtapePrecedente();
                } else if (action === "print") {
                    tracer("impression", etapeCouranteId);
                    window.print();
                } else if (action === "copy-link") {
                    copierLienDirect(btn);
                } else if (action === "crumb") {
                    sauterVersIndexAriane(parseInt(btn.getAttribute("data-index"), 10));
                } else if (action === "choice") {
                    naviguerVers(btn.getAttribute("data-dest"), btn.getAttribute("data-ariane"));
                } else if (action === "toggle-quiz") {
                    basculerAssistantQuiz(btn.getAttribute("data-quiz"));
                } else if (action === "quiz-step") {
                    afficherQuestionAssistant(btn.getAttribute("data-quiz"), btn.getAttribute("data-next"));
                } else if (action === "quiz-verdict") {
                    afficherVerdictAssistant(
                        btn.getAttribute("data-quiz"),
                        btn.getAttribute("data-step"),
                        parseInt(btn.getAttribute("data-opt"), 10)
                    );
                } else if (action === "toggle-copilot") {
                    basculerVoletDemarche();
                } else if (action === "toggle-role") {
                    basculerRoleDemarche(parseInt(btn.getAttribute("data-role-idx"), 10));
                } else if (action === "expand-all-roles") {
                    toutDeplierReplierRoles();
                }
            });

            window.addEventListener("popstate", function(e) {
                var etat = (e.state && e.state[CLE_HISTORIQUE]) ? e.state[CLE_HISTORIQUE] : null;
                var longueurAvant = traceNavigation.length;
                sensNavigation = (etat && Array.isArray(etat.trace) && etat.trace.length > longueurAvant) ? "forward" : "back";
                if (etat && etat.etapeId && logigramme[etat.etapeId]) {
                    etapeCouranteId = etat.etapeId;
                    traceNavigation = Array.isArray(etat.trace) ? etat.trace.slice() : [];
                } else {
                    traceNavigation = [];
                    etapeCouranteId = "etape_1";
                }
                rendreEtape(etapeCouranteId);
            });

            window.addEventListener("hashchange", function() {
                var cible = lireLienDirect();
                if (!cible || cible === etapeCouranteId) return;
                sensNavigation = "forward";
                traceNavigation = cible === "etape_1" ? [] : [{ id: "etape_1", label: "Lien direct" }];
                etapeCouranteId = cible;
                tracer("lien_direct", cible);
                try { window.history.replaceState(etatHistorique(), "", String(window.location.href).split("#")[0]); } catch (e) {}
                rendreEtape(etapeCouranteId);
            });

            var cibleInitiale = lireLienDirect();
            if (cibleInitiale && cibleInitiale !== "etape_1") {
                traceNavigation = [{ id: "etape_1", label: "Lien direct" }];
                etapeCouranteId = cibleInitiale;
                tracer("lien_direct", cibleInitiale);
            }

            try {
                var urlPropre = cibleInitiale ? String(window.location.href).split("#")[0] : undefined;
                window.history.replaceState(etatHistorique(), "", urlPropre);
            } catch (e) {}

            var versionEl = document.getElementById("content-version");
            if (versionEl) versionEl.textContent = VERSION_CONTENU;

            rendreEtape(etapeCouranteId);
        })();
    </script>
</body>
</html>
